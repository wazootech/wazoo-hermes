name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # weekly: catch worlds-api / wazoo-api spec drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit and contract tests
        run: python3 -m unittest discover -s tests -v
      - name: OpenAPI subset matches the published specs
        run: python3 tests/sync_openapi.py --check
